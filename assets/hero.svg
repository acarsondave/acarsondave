  <rect x="984" y="54" width="208" height="40" rx="20" fill="#f4ede1" fill-opacity="0.06" stroke="#f4ede1" stroke-opacity="0.14"/>
  <circle class="pulse" cx="1003" cy="74" r="5" fill="#8cc084"/>
  <circle cx="1003" cy="74" r="5" fill="#8cc084"/>
  <text x="1018" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f4ede1">Building · Lagos, NG</text>
</g>
<text x="1192" y="290" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" fill="#6b6359">7+ yrs · ACARSON LLC</text>
