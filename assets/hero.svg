  <rect x="984" y="54" width="208" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle class="pulse" cx="1003" cy="74" r="5" fill="#3fb950"/>
  <circle cx="1003" cy="74" r="5" fill="#3fb950"/>
  <text x="1018" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Building · Lagos, NG</text>
</g>
<text x="1192" y="290" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" fill="#5b6378">7+ yrs · ACARSON LLC</text>
