<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email David Uche</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#121110; --bone:#F1ECE2; --bone2:#BDB5A8; --danfo:#F5B700; --ease:cubic-bezier(.16,1,.3,1); }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--ink); color:var(--bone); font-family:Archivo, system-ui, sans-serif; display:grid; grid-template-rows:1fr auto; }
  ::selection { background:var(--danfo); color:var(--ink); }
  main { align-self:center; padding:32px clamp(20px, 6vw, 72px); max-width:900px; }
  h1 { font-weight:800; font-stretch:112%; font-size:clamp(36px, 7vw, 64px); letter-spacing:-0.03em; line-height:1; margin:0 0 14px; }
  p { color:var(--bone2); font-size:19px; line-height:1.5; margin:0 0 36px; max-width:48ch; }
  .addr { appearance:none; border:0; cursor:pointer; display:inline-flex; align-items:center; gap:16px;
          background:var(--danfo); color:var(--ink); font:inherit; font-weight:700; font-size:clamp(20px, 4.4vw, 32px);
          padding:18px 28px; border-radius:999px; transition:transform .25s var(--ease); }
  .addr:hover { transform:translateY(-2px); }
  .addr:active { transform:scale(.98); }
  .addr:focus-visible { outline:3px solid var(--bone); outline-offset:4px; }
  .addr svg { width:26px; height:26px; flex:none; }
  .state { display:inline-flex; align-items:center; gap:10px; margin-left:18px; font-weight:700; font-size:17px;
           opacity:0; transform:translateY(6px); transition:opacity .35s var(--ease), transform .35s var(--ease); }
  .state.on { opacity:1; transform:none; }
  .state .tick { stroke-dasharray:24; stroke-dashoffset:24; transition:stroke-dashoffset .45s .1s var(--ease); }
  .state.on .tick { stroke-dashoffset:0; }
  .row { display:flex; flex-wrap:wrap; align-items:center; row-gap:16px; }
  .links { margin-top:40px; display:flex; gap:28px; font-size:17px; }
  .links a { color:var(--bone); text-underline-offset:5px; text-decoration-color:var(--danfo); text-decoration-thickness:2px; }
  footer { height:30px; background:var(--danfo); position:relative; }
  footer::before, footer::after { content:""; position:absolute; left:0; right:0; height:5px; background:var(--ink); }
  footer::before { top:9px; } footer::after { top:17px; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<main>
  <h1>Say hello.</h1>
  <p>The address is below. It's on your clipboard already if your browser allowed it; tap it to copy again.</p>
  <div class="row">
    <button class="addr" id="addr" type="button" aria-describedby="state">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="4" width="24" height="18" rx="3"/><path d="M2 6l11 8 11-8"/></svg>
      <span id="text">acarsondev@gmail.com</span>
    </button>
    <span class="state" id="state" role="status" aria-live="polite">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="#F5B700"/><path class="tick" d="M6 11.5l3.5 3.5L16 8" stroke="#121110" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="label">Copied</span>
    </span>
  </div>
  <div class="links">
    <a href="mailto:acarsondev@gmail.com">Open in your mail app</a>
    <a href="https://github.com/acarsondave">Back to GitHub</a>
  </div>
</main>
<footer aria-hidden="true"></footer>
<script>
  const email = 'acarsondev@gmail.com';
  const state = document.getElementById('state');
  const label = document.getElementById('label');
  let t;
  function show(msg) {
    label.textContent = msg;
    state.classList.remove('on'); void state.offsetWidth; state.classList.add('on');
    clearTimeout(t); t = setTimeout(() => state.classList.remove('on'), 2600);
  }
  function fallbackCopy() {
    const r = document.createRange(); r.selectNodeContents(document.getElementById('text'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try { return document.execCommand('copy'); } catch { return false; }
  }
  async function copy(fromClick) {
    try { await navigator.clipboard.writeText(email); show('Copied'); }
    catch { if (fallbackCopy()) show('Copied'); else if (fromClick) show('Selected, press ⌘C'); }
  }
  document.getElementById('addr').addEventListener('click', () => copy(true));
  window.addEventListener('load', () => copy(false));
</script>
</body>
</html>
